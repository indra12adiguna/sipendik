<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Logo SIPENDIK</title>

<style>

/* =====================================================
   DASAR
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:
        Inter,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    min-height:100vh;

    background:
        linear-gradient(
            135deg,
            #f4f7ff 0%,
            #ffffff 50%,
            #eef2ff 100%
        );

    color:#172554;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:30px;
}


/* =====================================================
   CONTAINER
===================================================== */

.logo-container{
    width:100%;
    max-width:900px;

    background:#ffffff;

    border:1px solid #e5e7eb;

    border-radius:28px;

    padding:55px 45px;

    box-shadow:
        0 25px 70px
        rgba(15,23,42,.10);

    text-align:center;
}


/* =====================================================
   JUDUL
===================================================== */

.title{
    font-size:13px;
    font-weight:800;

    letter-spacing:2px;

    color:#315bdc;

    text-transform:uppercase;

    margin-bottom:10px;
}

.description{
    color:#64748b;

    font-size:14px;

    margin-bottom:45px;
}


/* =====================================================
   LOGO UTAMA
===================================================== */

.sipendik-logo{
    display:inline-flex;

    align-items:center;

    gap:18px;

    text-decoration:none;

    color:inherit;

    transition:
        transform .25s ease;
}

.sipendik-logo:hover{
    transform:
        translateY(-2px);
}


/* =====================================================
   ICON LOGO
===================================================== */

.sipendik-logo-icon{
    width:92px;
    height:92px;

    flex:none;

    filter:
        drop-shadow(
            0 12px 20px
            rgba(49,91,219,.25)
        );

    transition:
        transform .25s ease,
        filter .25s ease;
}

.sipendik-logo:hover
.sipendik-logo-icon{

    transform:
        scale(1.035);

    filter:
        drop-shadow(
            0 15px 25px
            rgba(49,91,219,.32)
        );
}


/* =====================================================
   TEXT LOGO
===================================================== */

.sipendik-logo-text{
    display:flex;

    flex-direction:column;

    align-items:flex-start;

    gap:5px;
}

.sipendik-name{
    font-size:42px;

    line-height:1;

    font-weight:900;

    letter-spacing:-1.8px;

    color:#172554;
}

.sipendik-subtitle{
    font-size:13px;

    line-height:1.4;

    font-weight:600;

    color:#64748b;

    letter-spacing:.1px;

    max-width:370px;
}


/* =====================================================
   GARIS AKSEN
===================================================== */

.logo-line{
    width:100%;

    height:4px;

    border-radius:999px;

    margin-top:9px;

    background:
        linear-gradient(
            90deg,
            #315bdc,
            #4f46e5
        );
}


/* =====================================================
   PREVIEW VARIANT
===================================================== */

.variants{
    margin-top:55px;

    padding-top:35px;

    border-top:
        1px solid #edf0f5;

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:20px;
}

.variant{
    border:1px solid #e5e7eb;

    border-radius:18px;

    padding:25px 15px;

    background:#fafbff;

    display:flex;

    align-items:center;

    justify-content:center;

    min-height:120px;
}


/* =====================================================
   ICON SAJA
===================================================== */

.icon-only{
    width:70px;
    height:70px;

    filter:
        drop-shadow(
            0 8px 15px
            rgba(49,91,219,.20)
        );
}


/* =====================================================
   LOGO KECIL
===================================================== */

.small-logo{
    display:flex;

    align-items:center;

    gap:9px;
}

.small-icon{
    width:40px;
    height:40px;
}

.small-name{
    font-size:18px;

    font-weight:900;

    color:#172554;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:650px){

    .logo-container{
        padding:
            40px 20px;

        border-radius:22px;
    }

    .sipendik-logo{
        flex-direction:column;

        gap:15px;
    }

    .sipendik-logo-text{
        align-items:center;

        text-align:center;
    }

    .sipendik-logo-icon{
        width:82px;
        height:82px;
    }

    .sipendik-name{
        font-size:34px;
    }

    .sipendik-subtitle{
        font-size:12px;
    }

    .variants{
        grid-template-columns:1fr;
    }

}

</style>
</head>


<body>


<div class="logo-container">

    <div class="title">
        SISTEM INFORMASI PENDATAAN PESERTA DIDIK
    </div>

    <div class="description">
        Logo resmi SIPENDIK
    </div>


    <!-- =================================================
         LOGO UTAMA
    ================================================== -->

    <a
        href="#"
        class="sipendik-logo"
    >

        <!-- ICON -->

        <svg
            class="sipendik-logo-icon"
            viewBox="0 0 100 100"
            xmlns="http://www.w3.org/2000/svg"
        >

            <defs>

                <!-- Gradient utama -->

                <linearGradient
                    id="sipGradient"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1"
                >

                    <stop
                        offset="0%"
                        stop-color="#315BDB"
                    />

                    <stop
                        offset="55%"
                        stop-color="#3F5FE0"
                    />

                    <stop
                        offset="100%"
                        stop-color="#4F46E5"
                    />

                </linearGradient>


                <!-- Shadow -->

                <filter
                    id="logoShadow"
                    x="-30%"
                    y="-30%"
                    width="160%"
                    height="160%"
                >

                    <feDropShadow
                        dx="0"
                        dy="7"
                        stdDeviation="6"
                        flood-color="#315BDB"
                        flood-opacity=".22"
                    />

                </filter>

            </defs>


            <!-- =================================================
                 BACKGROUND ICON
            ================================================== -->

            <rect
                x="6"
                y="6"
                width="88"
                height="88"
                rx="27"
                fill="url(#sipGradient)"
                filter="url(#logoShadow)"
            />


            <!-- =================================================
                 DECORATIVE SHAPE
            ================================================== -->

            <circle
                cx="75"
                cy="25"
                r="17"
                fill="white"
                opacity=".08"
            />

            <circle
                cx="24"
                cy="77"
                r="13"
                fill="white"
                opacity=".06"
            />


            <!-- =================================================
                 HIGHLIGHT
            ================================================== -->

            <path
                d="M25 28
                   C34 18, 48 15, 60 18"
                fill="none"
                stroke="white"
                stroke-width="3"
                stroke-linecap="round"
                opacity=".16"
            />


            <!-- =================================================
                 TEXT SIP
            ================================================== -->

            <text
                x="50"
                y="59"
                text-anchor="middle"

                font-family="
                    Arial,
                    Helvetica,
                    sans-serif
                "

                font-size="30"

                font-weight="900"

                letter-spacing="-2"

                fill="white"
            >
                SIP
            </text>


            <!-- =================================================
                 GARIS AKSEN
            ================================================== -->

            <rect
                x="28"
                y="68"
                width="44"
                height="4"
                rx="2"
                fill="white"
                opacity=".9"
            />

        </svg>


        <!-- TEXT -->

        <span class="sipendik-logo-text">

            <span class="sipendik-name">
                SIPENDIK
            </span>

            <span class="sipendik-subtitle">
                Sistem Informasi Pendataan Peserta Didik
            </span>

            <span class="logo-line"></span>

        </span>

    </a>


    <!-- =================================================
         VARIASI LOGO
    ================================================== -->

    <div class="variants">


        <!-- ICON SAJA -->

        <div class="variant">

            <svg
                class="icon-only"
                viewBox="0 0 100 100"
                xmlns="http://www.w3.org/2000/svg"
            >

                <defs>

                    <linearGradient
                        id="iconGradient1"
                        x1="0"
                        y1="0"
                        x2="1"
                        y2="1"
                    >

                        <stop
                            offset="0%"
                            stop-color="#315BDB"
                        />

                        <stop
                            offset="100%"
                            stop-color="#4F46E5"
                        />

                    </linearGradient>

                </defs>

                <rect
                    x="6"
                    y="6"
                    width="88"
                    height="88"
                    rx="27"
                    fill="url(#iconGradient1)"
                />

                <text
                    x="50"
                    y="59"
                    text-anchor="middle"
                    font-family="Arial, Helvetica, sans-serif"
                    font-size="30"
                    font-weight="900"
                    letter-spacing="-2"
                    fill="white"
                >
                    SIP
                </text>

                <rect
                    x="28"
                    y="68"
                    width="44"
                    height="4"
                    rx="2"
                    fill="white"
                />

            </svg>

        </div>


        <!-- LOGO KECIL -->

        <div class="variant">

            <div class="small-logo">

                <svg
                    class="small-icon"
                    viewBox="0 0 100 100"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <defs>

                        <linearGradient
                            id="iconGradient2"
                            x1="0"
                            y1="0"
                            x2="1"
                            y2="1"
                        >

                            <stop
                                offset="0%"
                                stop-color="#315BDB"
                            />

                            <stop
                                offset="100%"
                                stop-color="#4F46E5"
                            />

                        </linearGradient>

                    </defs>

                    <rect
                        x="6"
                        y="6"
                        width="88"
                        height="88"
                        rx="27"
                        fill="url(#iconGradient2)"
                    />

                    <text
                        x="50"
                        y="59"
                        text-anchor="middle"
                        font-family="Arial, Helvetica, sans-serif"
                        font-size="30"
                        font-weight="900"
                        letter-spacing="-2"
                        fill="white"
                    >
                        SIP
                    </text>

                    <rect
                        x="28"
                        y="68"
                        width="44"
                        height="4"
                        rx="2"
                        fill="white"
                    />

                </svg>


                <span class="small-name">
                    SIPENDIK
                </span>

            </div>

        </div>


        <!-- WORDMARK -->

        <div class="variant">

            <div>

                <div
                    style="
                    font-size:26px;
                    font-weight:900;
                    letter-spacing:-1px;
                    color:#172554;
                    "
                >
                    SIPENDIK
                </div>

                <div
                    style="
                    font-size:9px;
                    font-weight:600;
                    color:#64748b;
                    margin-top:5px;
                    "
                >
                    SISTEM INFORMASI
                    PENDATAAN PESERTA DIDIK
                </div>

            </div>

        </div>

    </div>

</div>


</body>
</html>
